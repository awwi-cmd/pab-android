org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Project lives on L:, Gradle/Kotlin/pub caches live on C:. Kotlin's
# relocatable incremental-compile cache computes a relative path between
# them, which throws on Windows (java.nio can't relativize across drive
# letters) and corrupts its own cache storage. Disabling Kotlin incremental
# compilation avoids that path entirely -- slower rebuilds, but it builds.
kotlin.incremental=false
